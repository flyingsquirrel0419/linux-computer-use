[project]
name = "linux-computer-use"
version = "0.1.1"
description = "MCP server that lets Claude Code / Codex control a Linux X11 desktop"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "mcp>=1.2,<2",
    "mss>=9",
    "pillow>=10",
    "python-xlib>=0.33",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
lcu = "lcu.server:main"
lcu-supervised = "lcu.supervisor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
