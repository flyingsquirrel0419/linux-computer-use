[project]
name = "linux-computer-use"
version = "0.1.0"
description = "MCP server that lets Claude Code / Codex control a Linux X11 desktop"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "mss>=9",
    "pillow>=10",
    "python-xlib>=0.33",
]

[project.scripts]
lcu = "lcu.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcu"]
