name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: uvx ruff check --select F,E9,PLE src scripts tests
      - name: Plugin manifests and install script
        run: |
          python3 -c "import json; [json.load(open(p)) for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
          bash -n install.sh

  test:
    # PyGObject comes from the distro and is built for the distro's own
    # python3, so each Python version is tested on a distro that ships it,
    # the same way install.sh sets things up.
    name: Python ${{ matrix.python }} (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            image: ubuntu:22.04
          - python: "3.11"
            image: debian:bookworm
          - python: "3.12"
            image: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            xvfb xinput openbox dbus dbus-x11

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check system Python version
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -c "import sys; v = '%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python }}', v"

      - name: Environment
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages
          uv sync

      - name: Tests (Xvfb + openbox)
        run: dbus-run-session -- scripts/ci_x11.sh -v
